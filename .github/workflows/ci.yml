name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Postgres mapped to host port 5433 so DATABASE_URL matches the dev
    # fingerprint the DSN guard requires (local host + port 5433). This lets
    # migrations + the API integration tests run without LANCE_ALLOW_PROD.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pottracker_dev
          POSTGRES_PASSWORD: dev_only_not_for_prod
          POSTGRES_DB: pottracker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pottracker_dev -d pottracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pottracker_dev:dev_only_not_for_prod@localhost:5433/pottracker

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Both extras: api carries runtime deps that tests import (alembic,
          # sqlalchemy for the migrations/_guard tests); dev carries lint /
          # test tooling. Local devs typically `pip install -e '.[api,dev]'`.
          pip install -e '.[api,dev]'

      - name: Ruff
        run: ruff check .

      - name: Migrate (alembic upgrade head)
        run: alembic upgrade head

      - name: Pytest
        # DATABASE_URL is set, so the `integration`-marked API tests run against
        # the migrated service instead of being skipped.
        run: pytest -q

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api,dev]'

      - name: Mypy
        # Scope (apps/shared/migrations) comes from [tool.mypy] files in pyproject.
        run: mypy

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tooling/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Phase-0 placeholder: Lance CNC Tracker regression suite hook.
  # When tracker test entrypoints are wired into this repo (or invoked via
  # submodule / sibling repo), this job runs them on every PR that touches
  # `shared/` or `migrations/`. R1 + R3 + R5 mitigation. Disabled until
  # tracker integration phase.
  tracker-regression:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "tracker regression placeholder"
