[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lance-tooling"
version = "0.0.0"
description = "Tool library + offset registry management for Lance Industries CNC mills"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    # passlib 1.7.4 (EOL) initializes its bcrypt backend by probing with a
    # >72-byte password; bcrypt >=4.1 hard-errors on that instead of truncating,
    # so passlib cannot start. Pin to the 4.0.x line (abi3 wheel, no source
    # build). Also matches the version the live Lance CNC Tracker runs (<5.0),
    # so tooling and tracker agree even though tooling is venv-isolated.
    "bcrypt>=4.0.1,<4.1",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5,<7",
    # Required by fastapi.testclient.TestClient (starlette's test client is
    # httpx-backed). Used by the API integration tests in tests/api/.
    "httpx>=0.27,<1.0",
    # Patch range — pre-commit hooks are pinned to v0.6.9 in
    # `.pre-commit-config.yaml`. Format/lint rules are stable across the 0.6.x
    # line, so CI may resolve a newer 0.6.x patch (security fixes, regex
    # corrections) without diverging from local pre-commit output. Bumping
    # the minor version (0.7+) requires updating the pre-commit rev together.
    "ruff>=0.6.9,<0.7",
    "mypy>=1.10,<2.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "apps*"]
exclude = ["tests*", "docs*", "tasks*", "migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live Postgres (DATABASE_URL); skipped when unavailable",
]

[tool.mypy]
python_version = "3.11"
# Gate the shipping code (app + shared library + migrations) plus the production
# operator scripts (poller service, soak, importer, user/type management). The
# throwaway `probe_*` / `extract_*` reverse-engineering scratch stays out (ctypes-
# heavy, ruff-waived like `ctypes_defs.py`); `tests/` is out of the type gate.
files = [
    "apps",
    "shared",
    "migrations",
    "scripts/focas_service.py",
    "scripts/focas_soak_simple.py",
    "scripts/soak_report.py",
    "scripts/import_tools.py",
    "scripts/manage_users.py",
    "scripts/seed_tool_types.py",
    "scripts/debug_poller.py",
    "scripts/focas_smoke.py",
    "src/techdb_insert.py",
]

[[tool.mypy.overrides]]
# No published type stubs for these; both are thin wrappers we call with a small,
# well-understood surface. Avoids pulling in stub packages as new dependencies.
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are immutable sentinels; using them as
# default argument values is the framework's intended pattern (not a B008 bug).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "apps.tooling.api.deps.require_role",
]

[tool.ruff.lint.per-file-ignores]
# HTTP-semantic error classes (NotFound, Conflict, …) intentionally don't carry
# the `Error` suffix N818 wants — they read as their HTTP status names.
"apps/tooling/api/errors.py" = ["N818"]
# `ProdConnectionRefused` reads as the action it names (a refused connection);
# the `Error` suffix would only make the message noisier. Same rationale as above.
"shared/dsn_guard.py" = ["N818"]
# FOCAS PMC/macro-discovery probe scripts (probe_modal_v*, probe_pot_table,
# probe_presetter, …). Same ctypes constraint as shared/focas/ctypes_defs.py:
# `_fields_` must be a plain mutable class attribute (RUF012 — ClassVar breaks
# ctypes), and the private `_STRUCT`-style names trip N801. Any new probe_*.py
# that declares a local ctypes Structure is covered by this glob — do not add
# inline `# noqa` (it trips RUF100 under the glob). Mirrors ctypes_defs.py.
"scripts/probe_*.py" = ["N801", "RUF012"]
# Same ctypes `_fields_` constraint: the lathe profile declares its local
# work-offset structures (IODBZOFS shape) next to the code that uses them.
"shared/focas/lathe.py" = ["RUF012"]
# Same again: the parameter-read module declares its local IODBPSD shape.
"shared/focas/params.py" = ["RUF012"]
# Same again: the bulk-read module declares its local ODBEXEPRG shape.
"shared/focas/client_reads.py" = ["RUF012"]
